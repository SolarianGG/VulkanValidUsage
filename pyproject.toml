[project]
name = "vkrag"
version = "0.1.0"
description = "Vulkan Valid Usage: RAG vs model memory experiment"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Matsvei Piarerva" }]
keywords = ["vulkan", "rag", "retrieval", "llm-evaluation", "bm25", "bge-m3"]
requires-python = ">=3.11,<3.12"
dependencies = [
    "typer>=0.12",
    "pydantic>=2.7",
    "pyyaml>=6.0",
    "beautifulsoup4>=4.12",
    "lxml>=5.2",
    "bm25s>=0.2",
    "PyStemmer>=2.2",
    "numpy>=1.26,<3",
    "pandas>=2.2",
    "scipy>=1.13",
    "statsmodels>=0.14",
    "matplotlib>=3.9",
    "httpx>=0.27",
    "openai>=1.40",
    "ollama>=0.3",
    "python-dotenv>=1.0",
    "rapidfuzz>=3.9",
    "tqdm>=4.66",
    "tokenizers>=0.20",
    "huggingface-hub>=0.25",
]

[project.optional-dependencies]
ml = [
    "torch>=2.4",
    "sentence-transformers>=3.0",
    "FlagEmbedding>=1.2",
    "faiss-cpu>=1.8",
    "transformers>=4.44",
]

[project.scripts]
vkrag = "vkrag.cli:app"

[dependency-groups]
dev = ["pytest>=8.2", "ruff>=0.8"]
report = [
    "ipykernel>=7.4.0",
    "nbclient>=0.11.0",
    "nbformat>=5.11.1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/vkrag"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.uv.sources]
torch = [{ index = "pytorch-cu124" }]

[[tool.uv.index]]
name = "pytorch-cu124"
url = "https://download.pytorch.org/whl/cu124"
explicit = true

[tool.ruff]
line-length = 140
target-version = "py311"
extend-exclude = ["notebooks/report.ipynb"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B"]
ignore = [
    "E741",  # short names like `l` are used for local lists
    "B023",  # closures are called within the same loop iteration (retrieval/run.py, report.py)
    "B905",  # zip() over aligned lists; strict= is not used
]

[tool.ruff.lint.per-file-ignores]
"tests/test_strata.py" = ["E501"]  # verbatim gpuinfo.org HTML rows

[tool.ruff.format]
line-ending = "lf"
